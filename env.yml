# Python and R runtime environment for the meco_tools container image (conda-forge/bioconda).
# Perl and its modules come from Debian packages instead (see Dockerfile): bioconda's Perl
# stack is frozen at perl 5.32 and perl-bioperl drags in samtools 0.1.19 / openssl 1.1,
# which cannot coexist with the current R/Bioconductor stack.
# External bioinformatics tools (blast, diamond, vsearch, samtools, RDP, ...) are
# deliberately NOT included; they are provided by their own containers in the pipeline.
name: base
channels:
  - conda-forge
  - bioconda
dependencies:
  # --- Python ---
  - python=3.12
  - numpy
  - pandas
  - scipy
  - h5py
  - pytables
  - tqdm
  - pip

  # --- R / CRAN ---
  - r-base=4.5                  # current Bioconductor builds on bioconda require R 4.5
  - r-ape
  - r-compositions
  - r-data.table
  - r-dplyr
  - r-ggplot2
  - r-gridextra
  - r-heatmap3
  - r-igraph
  - r-labdsv
  - r-matrix
  - r-outliers
  - r-pheatmap
  - r-plyr
  - r-rcolorbrewer
  - r-reshape
  - r-reshape2
  - r-scales
  - r-statmod

  # --- R / Bioconductor ---
  - bioconductor-basespacer
  - bioconductor-biostrings
  - bioconductor-dada2
  - bioconductor-delayedarray
  - bioconductor-dropletutils
  - bioconductor-edger
  - bioconductor-hdf5array
